# Reference compose file for the Postgres + auth migration.
# docker-compose.yml is off-limits for direct edits per CLAUDE.md's sensitive-file
# policy — apply these changes to your own docker-compose.yml by hand.
#
# All secrets/config come from the root .env file (see .env.example). Docker
# Compose automatically loads a .env file in the same directory as this compose
# file for ${VAR} substitution — no env_file: directive needed.

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"          # exposed so a local Postgres GUI can connect directly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./backend:/app
      # note: the old `./backend/notes.db:/data/notes.db` SQLite volume mount
      # is no longer needed — data now lives in the `db` service/volume below
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  pgdata:
